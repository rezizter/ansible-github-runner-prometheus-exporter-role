---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: instance
    image: "${MOLECULE_DISTRO:-geerlingguy/docker-amazonlinux2023-ansible:latest}"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      instance:
        # Use a dummy token during CI tests so the exporter starts without failing auth
        github_runner_exporter_env_vars:
          PORT: "9877"
          GITHUB_TOKEN: "ghp_dummy_token_for_molecule_testing_12345"
          GITHUB_ORG: "example-org"
verifier:
  name: ansible
