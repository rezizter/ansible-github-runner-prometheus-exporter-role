---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: instance
    image: "${MOLECULE_DISTRO:-geerlingguy/docker-amazonlinux2023-ansible:latest}"
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      instance:
        ansible_user: root
        ansible_become: false
        github_runner_exporter_env_vars:
          PORT: "9101"
          GITHUB_TOKEN: "ghp_dummy_token_for_molecule_testing_12345"
          GITHUB_ORG: "example-org"
verifier:
  name: ansible
