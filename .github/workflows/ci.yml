---
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (yamllint & ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (${{ matrix.distro }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: amazonlinux2023
            image: geerlingguy/docker-amazonlinux2023-ansible:latest
          - distro: rockylinux9
            image: geerlingguy/docker-rockylinux9-ansible:latest
          - distro: ubuntu2404
            image: geerlingguy/docker-ubuntu2404-ansible:latest
          - distro: ubuntu2204
            image: geerlingguy/docker-ubuntu2204-ansible:latest
          - distro: debian12
            image: geerlingguy/docker-debian12-ansible:latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and Docker driver
        run: pip install "ansible-core>=2.16,<2.17" molecule molecule-plugins[docker] docker

      - name: Install Ansible collections
        run: ansible-galaxy collection install community.docker

      - name: Run Molecule test
        run: molecule test -- -vv
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.image }}
